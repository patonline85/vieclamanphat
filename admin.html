<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Trị - Tiệm Hoa Nhà Sen</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="admin-bg">

    <!-- MÀN HÌNH ĐĂNG NHẬP -->
    <div id="login-screen" class="login-container">
        <div class="login-box">
            <h2>Đăng Nhập Quản Trị</h2>
            <form id="login-form">
                <input type="text" id="username" placeholder="Tên đăng nhập" required>
                <input type="password" id="password" placeholder="Mật khẩu" required>
                <p id="login-error" class="error-msg" style="display: none;">Sai tài khoản hoặc mật khẩu!</p>
                <button type="submit" class="btn-submit">Đăng Nhập</button>
            </form>
        </div>
    </div>

    <!-- MÀN HÌNH SOẠN THẢO (Ẩn mặc định) -->
    <div id="editor-screen" class="editor-container" style="display: none;">
        <header class="header admin-header">
            <div class="container header-content">
                <h1>Hệ Thống Đăng Bài</h1>
                <button id="logout-btn" class="btn-logout">Đăng Xuất</button>
            </div>
        </header>

        <main class="container">
            <div class="admin-card">
                <h2>Soạn bài tuyển dụng</h2>
                <form id="post-form">
                    <div class="form-group">
                        <label>Tiêu đề bài viết:</label>
                        <input type="text" id="title" required placeholder="VD: Tuyển nhân viên bán hàng...">
                    </div>
                    
                    <div class="form-group">
                        <label>Hình ảnh (Tên file trong thư mục images/ hoặc Link ảnh):</label>
                        <input type="text" id="image" required placeholder="VD: images/anh-tuyen-dung.jpg">
                    </div>

                    <div class="form-group">
                        <label>Nội dung (Copy & Paste từ Facebook):</label>
                        <!-- Textarea được làm lớn hơn để dán bài dài -->
                        <textarea id="content" rows="12" required placeholder="Dán nội dung tuyển dụng vào đây..."></textarea>
                    </div>

                    <!-- Ẩn 2 trường này đi và gán giá trị mặc định trong JS để index.html không bị lỗi giao diện -->
                    <input type="hidden" id="salary" value="Thỏa thuận">
                    <input type="hidden" id="location" value="Hải Phòng">

                    <button type="submit" id="submit-btn" class="btn-submit">🚀 Đăng Bài Lên Website</button>
                </form>
            </div>
        </main>
    </div>

    <script src="admin.js"></script>
</body>
</html>
