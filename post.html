<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết việc làm</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Thanh điều hướng -->
    <header class="header">
        <div class="container header-content">
            <div class="brand">
                <img src="logo.png" alt="Logo" class="logo" onerror="this.style.display='none'">
                <h1>Tuyển Dụng</h1>
            </div>
            <nav>
                <a href="index.html">Trang chủ</a>
                <a href="admin.html">Quản trị</a>
                <a href="index.html#contact" class="btn-contact-nav">Liên hệ ngay</a>
            </nav>
        </div>
    </header>

    <!-- Nội dung bài viết -->
    <main class="container">
        <div class="post-container" id="post-detail">
            <div class="loading-state">
                <div class="spinner"></div>
                <p>Đang tải bài viết...</p>
            </div>
        </div>
    </main>

    <!-- Chân trang (Rút gọn để tập trung vào bài) -->
    <footer class="footer" style="padding-top: 40px;">
        <div class="footer-bottom">
            <p>&copy; 2026 Tiệm Hoa Nhà Sen. Tất cả các quyền được bảo lưu.</p>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
